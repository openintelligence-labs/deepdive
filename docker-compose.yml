services:
  ollama:
    image: ollama/ollama:latest
    container_name: deepdive-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  searxng:
    image: searxng/searxng:latest
    container_name: deepdive-searxng
    ports:
      - "8888:8080"
    environment:
      - BASE_URL=http://localhost:8888/
      - INSTANCE_NAME=deepdive-searxng
    restart: unless-stopped

  deepdive:
    build: .
    container_name: deepdive-api
    ports:
      - "8000:8000"
    environment:
      - DEEPDIVE_LLM_BASE_URL=http://ollama:11434
      - DEEPDIVE_SEARXNG_BASE_URL=http://searxng:8080
      - DEEPDIVE_HOST=0.0.0.0
    depends_on:
      - ollama
      - searxng

volumes:
  ollama_data:
